name: Cleanup Appwrite Temp Reports

on:
  schedule:
    - cron: '0 0 */2 * *'  # Runs every 2 days at midnight UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install appwrite

    - name: Run Appwrite Cleanup Script
      env:
        APP_WRITE_API_ENDPOINT: ${{ secrets.APP_WRITE_API_ENDPOINT }}
        APP_WRITE_PROJECT_ID: ${{ secrets.APP_WRITE_PROJECT_ID }}
        APP_WRITE_API_KEY: ${{ secrets.APP_WRITE_API_KEY }}
        APP_WRITE_BUCKET_ID: ${{ secrets.APP_WRITE_BUCKET_ID }}
      run: python .github/scripts/cleanup_appwrite.py
